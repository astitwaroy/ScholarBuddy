# Render Blueprint: New → Blueprint → pick this repo. Paste DATABASE_URL (Neon) and GEMINI_API_KEY when asked.
services:
  - type: web
    name: scholarsathi
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AUTO_INGEST
        value: "true"
